<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Demo Courier · Verify receipt</title><style>body{font-family:system-ui,sans-serif;background:#f3f8fb;color:#203550;max-width:720px;margin:50px auto;padding:20px}main{background:white;border-radius:14px;padding:28px;border:1px solid #d6e4ef}pre{white-space:pre-wrap;background:#edf2f8;padding:16px;border-radius:8px}h1{font-size:24px}</style></head><body><main><h1>Courier case verification</h1><p id="state">Retrieving persisted courier record...</p><pre id="data"></pre></main><script>
(async()=>{const id=decodeURIComponent(location.pathname.split('/').pop());try{const r=await fetch('/api/receipts/'+encodeURIComponent(id));const data=await r.json();if(!r.ok)throw Error(data.error);document.getElementById('state').textContent='This receipt corresponds to a persisted courier record.';document.getElementById('data').textContent=JSON.stringify(data.case,null,2);}catch(e){document.getElementById('state').textContent='Unable to verify: '+e.message}})();
</script></body></html>
