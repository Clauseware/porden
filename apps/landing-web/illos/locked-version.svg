<svg class="li-locked-version" xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" fill="none" stroke="#2a2a2a" role="img" aria-labelledby="li-locked-version-t" aria-describedby="li-locked-version-d">
<title id="li-locked-version-t">Locked version</title>
<desc id="li-locked-version-d">A draft leaves the record on a rail plate, a version block travels it, and it is locked back into the record.</desc>
<style>
@scope (svg.li-locked-version) {
:scope{stroke:none;--d:var(--illos-dark,0);--g:var(--illos-ground,#ffffff);--ink:var(--illos-ink,#2a2a2a);--accent:var(--illos-accent,#1daf9c);--mute:color-mix(in srgb,var(--ink) 45%,var(--g))}
path,polygon,ellipse,circle{vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.top{fill:color-mix(in srgb,var(--ink) calc(var(--d) * 10% + (1 - var(--d)) * 0%),var(--g))}
.left{fill:color-mix(in srgb,var(--ink) calc(var(--d) * 5% + (1 - var(--d)) * 4%),var(--g))}
.right{fill:color-mix(in srgb,var(--ink) calc(var(--d) * 2% + (1 - var(--d)) * 9%),var(--g))}
.recess{fill:color-mix(in srgb,var(--ink) calc(var(--d) * 4% + (1 - var(--d)) * 6%),var(--g))}
.ttop{fill:color-mix(in srgb,var(--accent) calc(var(--d) * 30% + (1 - var(--d)) * 10%),var(--g))}
.tleft{fill:color-mix(in srgb,var(--accent) calc(var(--d) * 22% + (1 - var(--d)) * 18%),var(--g))}
.tright{fill:color-mix(in srgb,var(--accent) calc(var(--d) * 16% + (1 - var(--d)) * 26%),var(--g))}
.e,.m,.te,.tem{fill:none;stroke-width:1px}
.e{stroke:var(--ink)}.m{stroke:var(--mute)}.te{stroke:var(--accent)}
.tcell{fill:color-mix(in srgb,var(--accent) 75%,var(--g));stroke:var(--accent);stroke-width:1px}
.tem{stroke:color-mix(in srgb,var(--accent) 45%,var(--g))}
.d{stroke-dasharray:2 3}
.dot{fill:var(--ink)}.tdot{fill:var(--accent)}.mdot{fill:var(--mute)}

.cf{transform-box:fill-box;transform-origin:50% 50%}
.hist{animation:li-locked-version_hist 3s linear}
.old{animation:li-locked-version_old 3s linear}
.drop{animation:li-locked-version_drop 3s linear}
.new{opacity:0;animation:li-locked-version_new 3s linear}
.ty{animation:li-locked-version_ty 3s linear}
.tx{animation:li-locked-version_tx 3s linear}
.mflash{opacity:0;animation:li-locked-version_flash 3s linear}
.tlab{animation:li-locked-version_lab 3s linear}
@keyframes li-locked-version_hist{0%{transform:translate(0px,0px)}60%{transform:translate(0px,0px);animation-timing-function:cubic-bezier(0.32,0.72,0,1)}80%{transform:translate(-135.1px,-78px)}100%{transform:translate(-135.1px,-78px)}}
@keyframes li-locked-version_old{0%{opacity:1;transform:scale(1)}61.333%{opacity:1;transform:scale(1);animation-timing-function:cubic-bezier(0.23,1,0.32,1)}68.667%{opacity:0;transform:scale(0.94)}100%{opacity:0;transform:scale(0.94)}}
@keyframes li-locked-version_drop{0%{transform:translate(0px,-30px)}33.333%{transform:translate(0px,-30px);animation-timing-function:cubic-bezier(0.77,0,0.175,1)}44.667%{transform:translate(0px,0px);animation-timing-function:cubic-bezier(0.23,1,0.32,1)}47%{transform:translate(0px,-2px);animation-timing-function:cubic-bezier(0.77,0,0.175,1)}50%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}
@keyframes li-locked-version_new{0%{opacity:0;transform:scale(0.92)}33.333%{opacity:0;transform:scale(0.92);animation-timing-function:cubic-bezier(0.23,1,0.32,1)}41.333%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
@keyframes li-locked-version_ty{0%{transform:translate(0px,0px)}10%{transform:translate(0px,0px);animation-timing-function:cubic-bezier(0.77,0,0.175,1)}26.667%{transform:translate(90.07px,-52px)}37.333%{transform:translate(90.07px,-52px);animation-timing-function:cubic-bezier(0.77,0,0.175,1)}54%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}
@keyframes li-locked-version_tx{0%{transform:translate(0px,0px)}20.667%{transform:translate(0px,0px);animation-timing-function:cubic-bezier(0.77,0,0.175,1)}43.333%{transform:translate(135.1px,78px)}100%{transform:translate(135.1px,78px)}}
@keyframes li-locked-version_flash{0%{opacity:0}52%{opacity:0;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}55.333%{opacity:1;animation-timing-function:ease}70.667%{opacity:0}100%{opacity:0}}
@keyframes li-locked-version_lab{0%{opacity:1}7.333%{opacity:1;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}12%{opacity:0}80%{opacity:0;animation-timing-function:cubic-bezier(0.23,1,0.32,1)}90%{opacity:1}100%{opacity:1}}
*{animation-iteration-count:infinite!important;animation-play-state:var(--illos-play,running)!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
}
</style>
